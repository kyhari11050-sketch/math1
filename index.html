<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>톡! 펼쳐지는 직육면체</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f7ff;color:#17304e;font-family:'Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif}.page{max-width:1120px;margin:auto;padding:20px 20px 35px}header{text-align:center;margin-bottom:14px}h1{font-size:clamp(26px,4vw,38px);margin:4px 0 5px;font-weight:900;letter-spacing:-1px}header p{margin:0;color:#5a6d82;font-size:17px}.panel{background:#fff;border-radius:28px;box-shadow:0 10px 35px #24426a15;padding:22px}.steps{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}.step{background:#eaf0f9;padding:12px 17px;border-radius:18px;font-size:17px;font-weight:800;color:#60758d}.step.on{background:#fee18c;color:#563905}.step.done{background:#d6f6e5;color:#14744b}.arrow{font-weight:900;color:#a7b5c6}.guide{text-align:center;margin:12px 0 6px;font-size:clamp(20px,3vw,27px);font-weight:900;min-height:37px}.guide small{display:block;font-size:15px;font-weight:500;color:#65778b;margin-top:4px}.view{height:min(59vw,490px);min-height:320px;background:radial-gradient(circle at 50% 35%,#ffffff 0,#f3f8ff 65%,#e9f2fe 100%);border:2px solid #e4eefb;border-radius:25px;overflow:hidden;position:relative}svg{width:100%;height:100%;touch-action:manipulation;display:block}.face{cursor:pointer;stroke:#fff;stroke-width:2.5;stroke-linejoin:round;transition:filter .2s}.face:hover{filter:brightness(1.06)}.edge-hit{stroke:transparent;stroke-width:27;cursor:pointer;stroke-linecap:round}.edge-mark{stroke:#1c4269;stroke-width:5;stroke-linecap:round;pointer-events:none}.edge-mark.ready{stroke:#ed7b1b;stroke-width:8}.edge-mark.cut{stroke:#ed4d53;stroke-width:8;stroke-dasharray:10 6}.face-label{fill:#153957;font-size:16px;font-weight:900;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:#fff;stroke-width:3}.tap{pointer-events:none;fill:#fff;stroke:#f6b828;stroke-width:3}.taptext{pointer-events:none;font-size:15px;font-weight:900;fill:#8d5000;text-anchor:middle}.palette{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:15px 0 9px}.selectlabel{width:100%;text-align:center;color:#5b6c80;font-weight:800;font-size:14px}.face-btn{border:2px solid #d6e3f1;background:#fff;color:#244b71;border-radius:15px;padding:12px 20px;font-size:17px;font-weight:900;cursor:pointer;min-width:102px;box-shadow:0 3px 0 #dce6f1}.face-btn.selected{background:#ffe8a5;border-color:#e9ad27;color:#654300;box-shadow:0 3px 0 #e9c769}.face-btn:disabled{opacity:.5;cursor:default}.foot{display:flex;justify-content:space-between;gap:12px;margin-top:16px;align-items:center;flex-wrap:wrap}.hint{font-size:15px;color:#657992}.actions{display:flex;gap:9px;flex-wrap:wrap}button{font-family:inherit}button.action{border:0;border-radius:15px;font-size:17px;font-weight:850;padding:13px 20px;cursor:pointer;background:#e7f0fb;color:#25486c}.action.primary{background:#2164dc;color:white}.action:disabled{background:#e4e8ee;color:#9aa8b6;cursor:not-allowed}.finish{text-align:center;position:absolute;bottom:13px;left:50%;transform:translateX(-50%);font-size:16px;font-weight:900;color:#2164a8;background:#fff;border:2px solid #d8e8fc;padding:9px 18px;border-radius:18px;white-space:nowrap}.tag{position:absolute;top:12px;right:12px;background:#fff;border:1px solid #dce8f8;border-radius:12px;padding:8px 11px;color:#63809e;font-weight:800;font-size:13px}.confetti{font-size:28px}@media(max-width:600px){.page{padding:10px}.panel{padding:12px;border-radius:20px}.step{font-size:14px;padding:9px 10px}.arrow{display:none}.palette{gap:6px}.face-btn{padding:10px 9px;min-width:82px;font-size:15px}.view{min-height:315px}.foot{justify-content:center}.hint{text-align:center;width:100%}}
</style></head><body><div class="page"><header><h1>📦 톡! 펼쳐지는 직육면체</h1><p>면 하나, 모서리 하나만 골라 보세요!</p></header><main class="panel"><div class="steps"><span id="s1" class="step on">① 기준 면 고르기</span><span class="arrow">→</span><span id="s2" class="step">② 모서리 톡!</span><span class="arrow">→</span><span id="s3" class="step">③ 전개도 보기</span></div><div class="guide" id="guide">어떤 면을 바닥에 놓고 펼칠까요?<small>그림 속 면이나 아래 버튼을 눌러 보세요.</small></div><div class="view"><svg id="scene" viewBox="0 0 920 490" role="img" aria-label="모서리를 클릭해 펼치는 직육면체" ></svg><span class="tag" id="tag">직육면체</span><div id="finish" class="finish" hidden>✨ 짠! 전개도가 완성됐어요!</div></div><div class="palette" id="palette"><div class="selectlabel">기준 면을 골라요</div></div><div class="foot"><div class="hint" id="hint">💡 어느 면을 골라도 전개도를 만들 수 있어요.</div><div class="actions"><button class="action" id="rotate">↻ 다른 쪽 보기</button><button class="action primary" id="reset">처음부터 다시 ↺</button></div></div></main></div><script>
(()=>{'use strict';
const svg=document.getElementById('scene'),guide=document.getElementById('guide'),palette=document.getElementById('palette'),hint=document.getElementById('hint'),finish=document.getElementById('finish'),tag=document.getElementById('tag'),rotate=document.getElementById('rotate'),reset=document.getElementById('reset');
const W=2.8,H=1.8,D=1.7;const faces=[
{id:'front',name:'앞면',center:[0,0,D/2],u:[1,0,0],v:[0,1,0],lenU:W,lenV:H,normal:[0,0,1],color:'#79c6ff'},
{id:'back',name:'뒷면',center:[0,0,-D/2],u:[-1,0,0],v:[0,1,0],lenU:W,lenV:H,normal:[0,0,-1],color:'#a6d8f8'},
{id:'right',name:'오른쪽 면',center:[W/2,0,0],u:[0,0,-1],v:[0,1,0],lenU:D,lenV:H,normal:[1,0,0],color:'#ffcf80'},
{id:'left',name:'왼쪽 면',center:[-W/2,0,0],u:[0,0,1],v:[0,1,0],lenU:D,lenV:H,normal:[-1,0,0],color:'#f8b8a5'},
{id:'top',name:'윗면',center:[0,H/2,0],u:[1,0,0],v:[0,0,-1],lenU:W,lenV:D,normal:[0,1,0],color:'#a9e4b7'},
{id:'bottom',name:'밑면',center:[0,-H/2,0],u:[1,0,0],v:[0,0,1],lenU:W,lenV:D,normal:[0,-1,0],color:'#d5b6f3'}];
const add=(a,b)=>a.map((v,i)=>v+b[i]),sub=(a,b)=>a.map((v,i)=>v-b[i]),scale=(a,k)=>a.map(v=>v*k),dot=(a,b)=>a.reduce((s,v,i)=>s+v*b[i],0),cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],norm=a=>scale(a,1/Math.hypot(...a));
const verts=faces.map(f=>[[-1,-1],[1,-1],[1,1],[-1,1]].map(([x,y])=>add(f.center,add(scale(f.u,x*f.lenU/2),scale(f.v,y*f.lenV/2)))));
const key=p=>p.map(n=>Math.round(n*1000)).join(','),edges=[];
for(let i=0;i<6;i++)for(let j=0;j<4;j++){let a=verts[i][j],b=verts[i][(j+1)%4],k=[key(a),key(b)].sort().join('|');let e=edges.find(v=>v.key===k);if(e)e.faces.push(i);else edges.push({key:k,a,b,faces:[i]});}
if(edges.length!==12)throw Error('모서리 구성 오류');
let base=null,cutEdge=null,tree=null,state='choose',progress=0,cutProgress=0,yaw=.73,pitch=.5,timer=null,camShift=0;const ns='http://www.w3.org/2000/svg';
const el=(t,attrs,parent=svg)=>{let o=document.createElementNS(ns,t);Object.entries(attrs||{}).forEach(([k,v])=>o.setAttribute(k,v));parent.appendChild(o);return o;};
function rotateAround(p,anchor,axis,angle){const v=sub(p,anchor),c=Math.cos(angle),s=Math.sin(angle);return add(anchor,add(add(scale(v,c),scale(cross(axis,v),s)),scale(axis,dot(axis,v)*(1-c))));}
function applyOps(p,ops,isVector=false){for(let op of ops)p=rotateAround(p,isVector?[0,0,0]:op.anchor,op.axis,op.angle);return p;}
function folded(t,chosenTree){let ops=Array.from({length:6},()=>null),out=[];ops[base]=[];let q=[base];while(q.length){let i=q.shift(),op=ops[i];out[i]=verts[i].map(p=>applyOps(p,op));for(const e of chosenTree){if(!e.faces.includes(i))continue;let j=e.faces.find(v=>v!==i);if(ops[j]!==null)continue;let axis=norm(sub(applyOps(e.b,op),applyOps(e.a,op))),anchor=applyOps(e.a,op),n1=applyOps(faces[i].normal,op,true),n2=applyOps(faces[j].normal,op,true);let angle=Math.atan2(dot(axis,cross(n2,n1)),dot(n2,n1));ops[j]=[...op,{axis,anchor,angle:angle*t}];q.push(j);}}return out;}
function netRects(chosenTree){const v=folded(1,chosenTree),f=faces[base];return v.map(ps=>{let xy=ps.map(p=>[dot(sub(p,f.center),f.u),dot(sub(p,f.center),f.v)]);return{x1:Math.min(...xy.map(p=>p[0])),x2:Math.max(...xy.map(p=>p[0])),y1:Math.min(...xy.map(p=>p[1])),y2:Math.max(...xy.map(p=>p[1]))};});}
function validTree(es){let seen=new Set([base]),change=true;while(change){change=false;for(let e of es){if(seen.has(e.faces[0])!==seen.has(e.faces[1])){seen.add(e.faces[0]);seen.add(e.faces[1]);change=true;}}}return seen.size===6;}
function findTree(){let best=null,bestScore=-Infinity;const combos=(start,arr)=>{if(arr.length===5){if(!validTree(arr))return;let rs=netRects(arr);for(let i=0;i<6;i++)for(let j=i+1;j<6;j++)if(Math.min(rs[i].x2,rs[j].x2)-Math.max(rs[i].x1,rs[j].x1)>.025&&Math.min(rs[i].y2,rs[j].y2)-Math.max(rs[i].y1,rs[j].y1)>.025)return;let minx=Math.min(...rs.map(r=>r.x1)),maxx=Math.max(...rs.map(r=>r.x2)),miny=Math.min(...rs.map(r=>r.y1)),maxy=Math.max(...rs.map(r=>r.y2));let degree=arr.filter(e=>e.faces.includes(base)).length;let score=degree*22-((maxx-minx)*(maxy-miny))*0.5-Math.abs((maxx-minx)-(maxy-miny))*2; if(score>bestScore){best=arr.slice();bestScore=score;}return;}for(let i=start;i<edges.length;i++)if(edges[i]!==cutEdge)combos(i+1,[...arr,edges[i]]);};combos(0,[]);return best;}
function orient(){let c=Math.cos(yaw),s=Math.sin(yaw),p=Math.cos(pitch),q=Math.sin(pitch);return{rx:[c,0,-s],ry:[s*q,-p,c*q],depth:[s*p,q,c*p]};}
function project3(p){let o=orient();return[460+dot(p,o.rx)*113,239+dot(p,o.ry)*113];}
function projectNet(p){let f=faces[base];return[dot(sub(p,f.center),f.u),-dot(sub(p,f.center),f.v)];}
function projection(v,t){const all=v.flat().map(projectNet),minx=Math.min(...all.map(p=>p[0])),maxx=Math.max(...all.map(p=>p[0])),miny=Math.min(...all.map(p=>p[1])),maxy=Math.max(...all.map(p=>p[1]));const z=Math.min(720/Math.max(1,maxx-minx),390/Math.max(1,maxy-miny),145);const center=[(minx+maxx)/2,(miny+maxy)/2];return p=>{let a=project3(p),b=projectNet(p);b=[460+(b[0]-center[0])*z,236+(b[1]-center[1])*z];let k=t*t*(3-2*t);return[a[0]*(1-k)+b[0]*k,a[1]*(1-k)+b[1]*k];};}
function faceCoords(i){return verts[i].map(project3);}
function draw(){svg.replaceChildren();const t=state==='unfold'||state==='done'?progress:0;let all=state==='unfold'||state==='done'?folded(t,tree):verts;const P=state==='unfold'||state==='done'?projection(all,t):project3;
let ordered=[0,1,2,3,4,5].sort((a,b)=>{let o=orient();return dot(faces[a].center,o.depth)-dot(faces[b].center,o.depth);});
const polygon=(ps)=>ps.map(p=>P(p).map(n=>n.toFixed(2)).join(',')).join(' ');
for(let i of ordered){let f=faces[i],ps=all[i];let poly=el('polygon',{points:polygon(ps),fill:f.color,stroke:base===i?'#e7a620':'#fff','stroke-width':base===i?5:2.5,'stroke-linejoin':'round',opacity:state==='choose'&&dot(f.normal,orient().depth)<-.12?.35:1,class:'face'});if(state==='choose')poly.addEventListener('click',()=>selectBase(i));let c=ps.reduce((a,p)=>add(a,p),[0,0,0]).map(x=>x/4),pos=P(c);if(state!=='choose'||dot(f.normal,orient().depth)>-.1){let label=el('text',{x:pos[0],y:pos[1],dy:'6',class:'face-label'});label.textContent=state==='choose'?f.name:base===i?'기준 면':f.name;}}
if(state==='choose'||state==='edge'||state==='cut'){for(let e of edges){const a=P(e.a),b=P(e.b),visible=e.faces.some(i=>dot(faces[i].normal,orient().depth)>-.15);if(!visible)continue;let cutOrder=cutEdge&&tree?[cutEdge,...edges.filter(x=>!tree.includes(x)&&x!==cutEdge)]:[];let isCut=state==='cut'&&cutOrder.slice(0,cutProgress).includes(e);let selected=state==='cut'&&e===cutEdge;el('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],class:'edge-mark '+(isCut||selected?'cut':state==='edge'?'ready':'')});if(state==='edge'){let hit=el('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],class:'edge-hit'});hit.addEventListener('click',()=>selectEdge(e));}}}
if(state==='unfold'||state==='done'){for(let e of edges){let a=e.faces[0],b=e.faces[1],va=all[a],fa=faces[a]; // draw one edge segment per face, cuts display red on net boundaries
for(let faceId of e.faces){let faceVerts=all[faceId];let source=verts[faceId],ix=source.findIndex(v=>key(v)===key(e.a)),jx=source.findIndex(v=>key(v)===key(e.b));if(ix<0||jx<0)continue;let p=P(faceVerts[ix]),q=P(faceVerts[jx]);el('line',{x1:p[0],y1:p[1],x2:q[0],y2:q[1],stroke:tree.includes(e)?'#28537a':'#e95361','stroke-width':tree.includes(e)?3.2:4.2,'stroke-linecap':'round',opacity:.88});}}}
if(state==='edge'){let msg=el('text',{x:460,y:455,'text-anchor':'middle',fill:'#d47a15','font-size':'19','font-weight':'900'});msg.textContent='주황색 모서리 중 하나를 톡!';}
}
function updateUI(){document.getElementById('s1').className='step '+(state==='choose'?'on':'done');document.getElementById('s2').className='step '+(state==='edge'||state==='cut'?'on':state==='choose'?'':'done');document.getElementById('s3').className='step '+(state==='done'?'done':state==='unfold'?'on':'');finish.hidden=state!=='done';tag.textContent=state==='done'?'전개도':'직육면체';palette.style.display=state==='choose'?'flex':'none';rotate.disabled=state==='cut'||state==='unfold'||state==='done'; if(state==='choose'){guide.innerHTML='어떤 면을 바닥에 놓고 펼칠까요?<small>그림 속 면이나 아래 버튼을 눌러 보세요.</small>';hint.textContent='💡 어느 면을 골라도 전개도를 만들 수 있어요.';}if(state==='edge'){guide.innerHTML='좋아요! 이제 모서리 하나를 톡!<small>나머지 모서리는 저절로 잘려요.</small>';hint.textContent='👆 주황색 선을 눌러 보세요.';}if(state==='cut'){guide.innerHTML='싹둑싹둑! ✂️<small>나머지 모서리가 자동으로 잘리고 있어요.</small>';hint.textContent='✨ 곧 전개도가 펼쳐져요!';}if(state==='unfold'){guide.innerHTML='펼쳐진다~! 📦<small>선택한 면을 바닥에 놓고 펼쳐요.</small>';hint.textContent='👀 어떤 모양이 되는지 살펴보세요.';}if(state==='done'){guide.innerHTML='우와! 전개도가 되었어요! 🎉<small>다시 해 보면서 다른 모양도 찾아보세요.</small>';hint.textContent='💡 다른 면과 모서리를 고르면 모양도 달라질 수 있어요.';}draw();}
function selectBase(i){if(state!=='choose')return;base=i;state='edge';updateUI();}
function selectEdge(e){if(state!=='edge')return;cutEdge=e;tree=findTree();if(!tree){alert('이 모서리로는 펼치기 어려워요. 다른 모서리를 눌러 주세요.');return;}state='cut';cutProgress=0;updateUI();let count=0;const ordered=[e,...edges.filter(x=>!tree.includes(x)&&x!==e)];let interval=setInterval(()=>{if(state!=='cut'){clearInterval(interval);return;}count++;cutProgress=count;draw();if(count>=ordered.length){clearInterval(interval);state='unfold';progress=0;updateUI();let start=performance.now(),duration=1900;function frame(now){if(state!=='unfold')return;progress=Math.min(1,(now-start)/duration);draw();if(progress<1)requestAnimationFrame(frame);else{state='done';updateUI();}}requestAnimationFrame(frame);}},250);
// custom cut order for animation
const originalDraw=draw; /* selected edge is immediately highlighted, other cut lines appear before unfolding */
}
function startOver(){state='choose';base=null;cutEdge=null;tree=null;progress=0;cutProgress=0;updateUI();}
faces.forEach((f,i)=>{let b=document.createElement('button');b.className='face-btn';b.textContent=f.name;b.onclick=()=>selectBase(i);palette.appendChild(b);});rotate.onclick=()=>{if(state==='choose'||state==='edge'){yaw+=Math.PI/2;draw();}};reset.onclick=startOver;
// Support touch and pointer rotation by dragging in the 3D view (optional).
let pt=null;svg.addEventListener('pointerdown',e=>{if(state==='choose'){pt=[e.clientX,e.clientY];}});svg.addEventListener('pointerup',e=>{if(pt&&state==='choose'&&Math.abs(e.clientX-pt[0])>28){yaw+=(e.clientX-pt[0])*.009;draw();}pt=null;});
updateUI();
})();
</script></body></html>
